<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Second-Hand Trading Platform - Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f0f2f5;
    }
    header {
      background: #165DFF;
      color: white;
      padding: 22px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .container {
      max-width: 1000px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
    }
    .title {
      font-size: 28px;
      margin-bottom: 15px;
      color: #1f2937;
    }
    .sub-title {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 40px;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .btn {
      padding: 14px 32px;
      background: white;
      color: #165DFF;
      border: 2px solid #165DFF;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: #165DFF;
      color: white;
      transform: translateY(-2px);
    }
    .featured {
      background: #165DFF;
      color: white;
      border: none;
    }
    .featured:hover {
      background: #0d47a1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Campus Second-Hand Trading Platform</h1>
  </header>

  <div class="container">
    <h2 class="title">Welcome to Our Trading System</h2>
    <p class="sub-title">Please select your identity to enter the corresponding system</p >

    <div class="btn-group">
      <a href=" " class="btn featured">Platform Introduction</a >
      <a href="user.html" class="btn">Buyer (User)</a >
      <a href="seller.html" class="btn">Seller</a >
    </div>
  </div>
</body>
</html>
